&lt;script type=&quot;text/plain&quot; id=&quot;py-src&quot;&gt;
n = 10
m = 1

def walk(n, m):
    # 이웃한 두 점 사이가 π 이므로 kπ 만큼 옮기는 것은 k 칸 옮기는 것이다
    path = [0]
    a = m % n                          # 1단계: 0 번 점에서 m 칸
    while a not in path:
        path.append(a)
        a = (a + a * m) % n            # 다음 단계: 지금 번호 × m 칸
    path.append(a)                     # 다시 놓인 점에서 멈춘다
    return path

m = min(max(m, 1), n - 1)              # m 은 n 미만의 자연수
path = walk(n, m)
seen = set(path)

print(&quot;말이 놓인 차례 :&quot;, &quot; → &quot;.join(map(str, path)))
print(&quot;서로 다른 점&quot;, len(seen), &quot;개 · 번호의 합&quot;, sum(seen))

result = {&quot;n&quot;: n, &quot;m&quot;: m, &quot;밟은 점 수&quot;: len(seen), &quot;번호의 합&quot;: sum(seen), &quot;path&quot;: path}
&lt;/script&gt;

// 끌 점이 없는 문제다.
var DRAG = [];

function circle(ctx, w, h, n, path, odd) {
  var cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 30;
  function P(i) { var t = -Math.PI / 2 + 2 * Math.PI * i / n; return [cx + R * Math.cos(t), cy + R * Math.sin(t)]; }
  ctx.strokeStyle = css(&quot;--rule&quot;); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.stroke();
  var seen = {};
  for (var k = 0; k &lt; path.length - 1; k++) seen[path[k]] = true;
  // 지나간 길 — 마지막 한 걸음(다시 놓인 점)은 점선
  ctx.strokeStyle = css(&quot;--accent&quot;); ctx.lineWidth = 2;
  for (k = 0; k + 1 &lt; path.length; k++) {
    var a = P(path[k]), b = P(path[k + 1]);
    ctx.setLineDash(k + 2 === path.length ? [5, 4] : []);
    ctx.globalAlpha = 0.35 + 0.65 * (k + 1) / path.length;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  var r = Math.max(7, Math.min(13, 120 / n));
  ctx.font = &quot;600 &quot; + Math.round(r * 1.1) + &quot;px &quot; + css(&quot;--mono&quot;);
  ctx.textAlign = &quot;center&quot;; ctx.textBaseline = &quot;middle&quot;;
  for (var i = 0; i &lt; n; i++) {
    var q = P(i);
    if (odd &amp;&amp; i % 2) {
      ctx.strokeStyle = css(&quot;--gold&quot;); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(q[0], q[1], r + 4, 0, 2 * Math.PI); ctx.stroke();
    }
    ctx.fillStyle = seen[i] ? css(&quot;--accent&quot;) : css(&quot;--surface&quot;);
    ctx.strokeStyle = css(&quot;--ink-faint&quot;); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(q[0], q[1], r, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
    ctx.fillStyle = seen[i] ? &quot;#fff&quot; : css(&quot;--ink&quot;);
    ctx.fillText(String(i), q[0], q[1] + 0.5);
  }
}

// n 이 바뀌면 m 슬라이더의 끝을 n - 1 에 맞춘다
(function () {
  var nS = document.querySelector(&#x27;input[data-var=&quot;n&quot;]&#x27;), mS = document.querySelector(&#x27;input[data-var=&quot;m&quot;]&#x27;);

var code = $(&quot;code&quot;), codeAll = $(&quot;code-all&quot;), py = null, last = null, timer = null, lastRow = &quot;&quot;;
var queue = Promise.resolve();
code.value = $(&quot;py-src&quot;).textContent.replace(/^\s*\n/, &quot;&quot;);
codeAll.value = $(&quot;py-all&quot;).textContent.replace(/^\s*\n/, &quot;&quot;);

var view = { s: 1, ox: 0, oy: 0 };
function px(p) { return [view.ox + p[0] * view.s, view.oy + p[1] * view.s]; }
function unpx(x, y) { return [(x - view.ox) / view.s, (y - view.oy) / view.s]; }

function setVar(name, val) {
  var re = new RegExp(&quot;^&quot; + name + &quot;\\s*=.*$&quot;, &quot;m&quot;);
  [code, codeAll].forEach(function (box) {
    box.value = re.test(box.value) ? box.value.replace(re, name + &quot; = &quot; + val) : name + &quot; = &quot; + val + &quot;\n&quot; + box.value;

}

// 파이썬 한 번 돌리기. 두 코드가 겹쳐 돌지 않게 차례로 줄 세운다.
function exec(src) {
  var job = queue.then(async function () {
    var buf = [];
    py.setStdout({ batched: function (s) { buf.push(s); } });
    py.setStderr({ batched: function (s) { buf.push(s); } });
    try {
      py.runPython(&quot;result = None&quot;);
      await py.runPythonAsync(src);
      var r = py.globals.get(&quot;result&quot;);
      var val = r &amp;&amp; r.toJs ? r.toJs({ dict_converter: Object.fromEntries }) : null;
      if (r &amp;&amp; r.destroy) r.destroy();
      return { ok: true, text: buf.join(&quot;\n&quot;), result: val };
    } catch (e) {
      var lines = String(e.message || e).trim().split(&quot;\n&quot;);
      return { ok: false, text: buf.concat([lines[lines.length - 1]]).join(&quot;\n&quot;), result: null };
    }
  });
  queue = job.catch(function () {});
  return job;
}

async function run() {

  $(&quot;out&quot;).textContent = r.text;

  last = r.result;

}
async function runAll() {

function paint() {
  $(&quot;readout&quot;).innerHTML = COLUMNS.map(function (k) {
    var v = last &amp;&amp; k in last ? last[k] : &quot;–&quot;;
    return &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;dt&gt;&#x27; + k + &quot;&lt;/dt&gt;&lt;dd&gt;&quot; + v + &quot;&lt;/dd&gt;&lt;/div&gt;&quot;;

  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  var m = 16;
  view.s = Math.min(w - 2 * m, h - 2 * m) / 100;
  view.ox = (w - 100 * view.s) / 2; view.oy = (h - 100 * view.s) / 2;
  var ctx = cv.getContext(&quot;2d&quot;);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  msg(&quot;&quot;);
  draw(ctx, w, h, last);
  if (DRAG.length &amp;&amp; last &amp;&amp; last[&quot;점&quot;]) {
    DRAG.forEach(function (k) {
      var p = last[&quot;점&quot;][k]; if (!p) return;
      var q = px(p);
      ctx.beginPath(); ctx.arc(q[0], q[1], 9, 0, 2 * Math.PI);
      ctx.fillStyle = css(&quot;--accent&quot;); ctx.globalAlpha = .22; ctx.fill(); ctx.globalAlpha = 1;
    });
  }
}

function logRow() {
  if (!last) return;
  var thead = $(&quot;log&quot;).tHead, tbody = $(&quot;log&quot;).tBodies[0];
  if (!thead.rows.length) thead.innerHTML = &quot;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&quot; + COLUMNS.map(function (k) { return &quot;&lt;th&gt;&quot; + k + &quot;&lt;/th&gt;&quot;; }).join(&quot;&quot;) + &quot;&lt;/tr&gt;&quot;;
  var cells = COLUMNS.map(function (k) { return k in last ? last[k] : &quot;&quot;; });
  var key = cells.join(&quot;|&quot;);
  if (key === lastRow) return;
  lastRow = key;

  tr.innerHTML = &quot;&lt;td&gt;&quot; + (tbody.rows.length + 1) + &quot;&lt;/td&gt;&quot; + cells.map(function (c) { return &quot;&lt;td&gt;&quot; + c + &quot;&lt;/td&gt;&quot;; }).join(&quot;&quot;);
  tbody.insertBefore(tr, tbody.firstChild);
}

// 점 끌기 — 끄는 동안 점 줄을 바꾸고 파이썬을 다시 돌린다
(function () {
  var cv = $(&quot;fig&quot;), held = null;
  if (DRAG.length) cv.classList.add(&quot;drag&quot;);
  function at(e) { var b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; }
  cv.addEventListener(&quot;pointerdown&quot;, function (e) {
    if (!DRAG.length || !last || !last[&quot;점&quot;]) return;
    var m = at(e), best = 22;
    DRAG.forEach(function (k) {
      var p = last[&quot;점&quot;][k]; if (!p) return;
      var q = px(p), d = Math.hypot(q[0] - m[0], q[1] - m[1]);
      if (d &lt; best) { best = d; held = k; }
    });
    if (held) { cv.setPointerCapture(e.pointerId); e.preventDefault(); }
  });
  cv.addEventListener(&quot;pointermove&quot;, function (e) {
    if (!held) return;
    var m = at(e), p = unpx(m[0], m[1]);
    var x = Math.max(0, Math.min(100, Math.round(p[0]))), y = Math.max(0, Math.min(100, Math.round(p[1])));
    last[&quot;점&quot;][held] = [x, y];
    setVar(held, &quot;(&quot; + x + &quot;, &quot; + y + &quot;)&quot;);
    paint();
    runSoon();
  });
  function drop() { held = null; }
  cv.addEventListener(&quot;pointerup&quot;, drop);
  cv.addEventListener(&quot;pointercancel&quot;, drop);
})();

      &lt;div class=&quot;row&quot; style=&quot;margin-top:8px&quot;&gt;

&lt;script type=&quot;text/plain&quot; id=&quot;py-src&quot;&gt;
n = 10
m = 1

def walk(n, m):
    # 이웃한 두 점 사이가 π 이므로 kπ 만큼 옮기는 것은 k 칸 옮기는 것이다
    path = [0]
    a = m % n                          # 1단계: 0 번 점에서 m 칸
    while a not in path:
        path.append(a)
        a = (a + a * m) % n            # 다음 단계: 지금 번호 × m 칸
    path.append(a)                     # 다시 놓인 점에서 멈춘다
    return path

m = min(max(m, 1), n - 1)
path = walk(n, m)
seen = set(path)
missed = [i for i in range(n) if i not in seen]
odd_seen = [i for i in seen if i % 2 == 1]

print(&quot;말이 놓인 차례 :&quot;, &quot; → &quot;.join(map(str, path)))
print(&quot;못 밟은 점 :&quot;, missed if missed else &quot;없다&quot;)
print(&quot;밟은 홀수 번호 점 :&quot;, sorted(odd_seen))

result = {&quot;n&quot;: n, &quot;m&quot;: m, &quot;밟은 점 수&quot;: len(seen), &quot;못 밟은 점 수&quot;: len(missed),
          &quot;밟은 홀수 점 수&quot;: len(odd_seen), &quot;path&quot;: path}
&lt;/script&gt;

&lt;script type=&quot;text/plain&quot; id=&quot;py-all&quot;&gt;
n = 10

def walk(n, m):
    # 이웃한 두 점 사이가 π 이므로 kπ 만큼 옮기는 것은 k 칸 옮기는 것이다
    path = [0]
    a = m % n                          # 1단계: 0 번 점에서 m 칸
    while a not in path:
        path.append(a)
        a = (a + a * m) % n            # 다음 단계: 지금 번호 × m 칸
    path.append(a)                     # 다시 놓인 점에서 멈춘다
    return path

# m 을 모두 굴려, 모든 점을 밟는 m 이 있는지 본다
for m in range(1, n):
    seen = set(walk(n, m))
    missed = [i for i in range(n) if i not in seen]
    odd = sorted(i for i in seen if i % 2 == 1)
    print(f&quot;m = {m:&gt;2}  못 밟은 점 {len(missed):&gt;2} 개   밟은 홀수 점 {odd}&quot;)
&lt;/script&gt;

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/pyodide@0.26.4/pyodide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
/* ===== 이 문제에 맞게 바꾼 부분 ===== */
// 수치 판과 표에 보일 열. result 사전의 키 이름이다.
var COLUMNS = [&quot;n&quot;, &quot;m&quot;, &quot;밟은 점 수&quot;, &quot;못 밟은 점 수&quot;, &quot;밟은 홀수 점 수&quot;];

// 끌 점이 없는 문제다.
var DRAG = [];

function circle(ctx, w, h, n, path, odd) {
  var cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 30;
  function P(i) { var t = -Math.PI / 2 + 2 * Math.PI * i / n; return [cx + R * Math.cos(t), cy + R * Math.sin(t)]; }
  ctx.strokeStyle = css(&quot;--rule&quot;); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.stroke();
  var seen = {};
  for (var k = 0; k &lt; path.length - 1; k++) seen[path[k]] = true;
  // 지나간 길 — 마지막 한 걸음(다시 놓인 점)은 점선
  ctx.strokeStyle = css(&quot;--accent&quot;); ctx.lineWidth = 2;
  for (k = 0; k + 1 &lt; path.length; k++) {
    var a = P(path[k]), b = P(path[k + 1]);
    ctx.setLineDash(k + 2 === path.length ? [5, 4] : []);
    ctx.globalAlpha = 0.35 + 0.65 * (k + 1) / path.length;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  var r = Math.max(7, Math.min(13, 120 / n));
  ctx.font = &quot;600 &quot; + Math.round(r * 1.1) + &quot;px &quot; + css(&quot;--mono&quot;);
  ctx.textAlign = &quot;center&quot;; ctx.textBaseline = &quot;middle&quot;;
  for (var i = 0; i &lt; n; i++) {
    var q = P(i);
    if (odd &amp;&amp; i % 2) {
      ctx.strokeStyle = css(&quot;--gold&quot;); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(q[0], q[1], r + 4, 0, 2 * Math.PI); ctx.stroke();
    }
    ctx.fillStyle = seen[i] ? css(&quot;--accent&quot;) : css(&quot;--surface&quot;);
    ctx.strokeStyle = css(&quot;--ink-faint&quot;); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(q[0], q[1], r, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
    ctx.fillStyle = seen[i] ? &quot;#fff&quot; : css(&quot;--ink&quot;);
    ctx.fillText(String(i), q[0], q[1] + 0.5);
  }
}

// n 이 바뀌면 m 슬라이더의 끝을 n - 1 에 맞춘다
(function () {
  var nS = document.querySelector(&#x27;input[data-var=&quot;n&quot;]&#x27;), mS = document.querySelector(&#x27;input[data-var=&quot;m&quot;]&#x27;);
  if (!nS || !mS) return;
  nS.addEventListener(&quot;input&quot;, function () {
    var top = +nS.value - 1, old = +mS.value;
    mS.max = top;
    if (old &gt; top) { mS.value = top; mS.dispatchEvent(new Event(&quot;input&quot;)); }
  });
})();

function draw(ctx, w, h, r) {
  if (!r) return;
  circle(ctx, w, h, r.n, r.path, true);
  msg(r[&quot;못 밟은 점 수&quot;] ? &quot;못 밟은 점이 &quot; + r[&quot;못 밟은 점 수&quot;] + &quot; 개 남았다.&quot; : &quot;모든 점을 밟았다.&quot;);
}

/* ===== 고치지 않는 부분: 파이썬 실행 · 슬라이더 · 점 끌기 · 수치 판 · 표 · 전체 케이스 ===== */
var $ = function (id) { return document.getElementById(id); };
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function msg(text, kind) { var m = $(&quot;fig-msg&quot;); m.textContent = text || &quot;&quot;; m.className = &quot;msg&quot; + (kind ? &quot; &quot; + kind : &quot;&quot;); }

var code = $(&quot;code&quot;), codeAll = $(&quot;code-all&quot;), py = null, last = null, timer = null, lastRow = &quot;&quot;;
var queue = Promise.resolve();
code.value = $(&quot;py-src&quot;).textContent.replace(/^\s*\n/, &quot;&quot;);
codeAll.value = $(&quot;py-all&quot;).textContent.replace(/^\s*\n/, &quot;&quot;);

var view = { s: 1, ox: 0, oy: 0 };
function px(p) { return [view.ox + p[0] * view.s, view.oy + p[1] * view.s]; }
function unpx(x, y) { return [(x - view.ox) / view.s, (y - view.oy) / view.s]; }

function setVar(name, val) {
  var re = new RegExp(&quot;^&quot; + name + &quot;\\s*=.*$&quot;, &quot;m&quot;);
  [code, codeAll].forEach(function (box) {
    box.value = re.test(box.value) ? box.value.replace(re, name + &quot; = &quot; + val) : name + &quot; = &quot; + val + &quot;\n&quot; + box.value;
  });
}

// 파이썬 한 번 돌리기. 두 코드가 겹쳐 돌지 않게 차례로 줄 세운다.
function exec(src) {
  var job = queue.then(async function () {
    var buf = [];
    py.setStdout({ batched: function (s) { buf.push(s); } });
    py.setStderr({ batched: function (s) { buf.push(s); } });
    try {
      py.runPython(&quot;result = None&quot;);
      await py.runPythonAsync(src);
      var r = py.globals.get(&quot;result&quot;);
      var val = r &amp;&amp; r.toJs ? r.toJs({ dict_converter: Object.fromEntries }) : null;
      if (r &amp;&amp; r.destroy) r.destroy();
      return { ok: true, text: buf.join(&quot;\n&quot;), result: val };
    } catch (e) {
      var lines = String(e.message || e).trim().split(&quot;\n&quot;);
      return { ok: false, text: buf.concat([lines[lines.length - 1]]).join(&quot;\n&quot;), result: null };
    }
  });
  queue = job.catch(function () {});
  return job;
}

async function run() {
  if (!py) return;
  var r = await exec(code.value);
  $(&quot;out&quot;).textContent = r.text;
  $(&quot;out&quot;).classList.toggle(&quot;err&quot;, !r.ok);
  last = r.result;
  if (r.ok) logRow();
  paint();
  if ($(&quot;all&quot;).open) runAll();
}
async function runAll() {
  if (!py) return;
  $(&quot;all-out&quot;).textContent = &quot;세는 중&quot;;
  var r = await exec(codeAll.value);
  $(&quot;all-out&quot;).textContent = r.text;
  $(&quot;all-out&quot;).classList.toggle(&quot;err&quot;, !r.ok);
}
function runSoon() { clearTimeout(timer); timer = setTimeout(run, 120); }

function paint() {
  $(&quot;readout&quot;).innerHTML = COLUMNS.map(function (k) {
    var v = last &amp;&amp; k in last ? last[k] : &quot;–&quot;;
    return &#x27;&lt;div class=&quot;stat&quot;&gt;&lt;dt&gt;&#x27; + k + &quot;&lt;/dt&gt;&lt;dd&gt;&quot; + v + &quot;&lt;/dd&gt;&lt;/div&gt;&quot;;
  }).join(&quot;&quot;);
  var cv = $(&quot;fig&quot;), dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = +cv.dataset.h || 220;
  cv.style.height = h + &quot;px&quot;;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  var m = 16;
  view.s = Math.min(w - 2 * m, h - 2 * m) / 100;
  view.ox = (w - 100 * view.s) / 2; view.oy = (h - 100 * view.s) / 2;
  var ctx = cv.getContext(&quot;2d&quot;);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  msg(&quot;&quot;);
  draw(ctx, w, h, last);
  if (DRAG.length &amp;&amp; last &amp;&amp; last[&quot;점&quot;]) {
    DRAG.forEach(function (k) {
      var p = last[&quot;점&quot;][k]; if (!p) return;
      var q = px(p);
      ctx.beginPath(); ctx.arc(q[0], q[1], 9, 0, 2 * Math.PI);
      ctx.fillStyle = css(&quot;--accent&quot;); ctx.globalAlpha = .22; ctx.fill(); ctx.globalAlpha = 1;
    });
  }
}

function logRow() {
  if (!last) return;
  var thead = $(&quot;log&quot;).tHead, tbody = $(&quot;log&quot;).tBodies[0];
  if (!thead.rows.length) thead.innerHTML = &quot;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&quot; + COLUMNS.map(function (k) { return &quot;&lt;th&gt;&quot; + k + &quot;&lt;/th&gt;&quot;; }).join(&quot;&quot;) + &quot;&lt;/tr&gt;&quot;;
  var cells = COLUMNS.map(function (k) { return k in last ? last[k] : &quot;&quot;; });
  var key = cells.join(&quot;|&quot;);
  if (key === lastRow) return;
  lastRow = key;
  var tr = document.createElement(&quot;tr&quot;);
  tr.innerHTML = &quot;&lt;td&gt;&quot; + (tbody.rows.length + 1) + &quot;&lt;/td&gt;&quot; + cells.map(function (c) { return &quot;&lt;td&gt;&quot; + c + &quot;&lt;/td&gt;&quot;; }).join(&quot;&quot;);
  tbody.insertBefore(tr, tbody.firstChild);
}

// 점 끌기 — 끄는 동안 점 줄을 바꾸고 파이썬을 다시 돌린다
(function () {
  var cv = $(&quot;fig&quot;), held = null;
  if (DRAG.length) cv.classList.add(&quot;drag&quot;);
  function at(e) { var b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; }
  cv.addEventListener(&quot;pointerdown&quot;, function (e) {
    if (!DRAG.length || !last || !last[&quot;점&quot;]) return;
    var m = at(e), best = 22;
    DRAG.forEach(function (k) {
      var p = last[&quot;점&quot;][k]; if (!p) return;
      var q = px(p), d = Math.hypot(q[0] - m[0], q[1] - m[1]);
      if (d &lt; best) { best = d; held = k; }
    });
    if (held) { cv.setPointerCapture(e.pointerId); e.preventDefault(); }
  });
  cv.addEventListener(&quot;pointermove&quot;, function (e) {
    if (!held) return;
    var m = at(e), p = unpx(m[0], m[1]);
    var x = Math.max(0, Math.min(100, Math.round(p[0]))), y = Math.max(0, Math.min(100, Math.round(p[1])));
    last[&quot;점&quot;][held] = [x, y];
    setVar(held, &quot;(&quot; + x + &quot;, &quot; + y + &quot;)&quot;);
    paint();
    runSoon();
  });
  function drop() { held = null; }
  cv.addEventListener(&quot;pointerup&quot;, drop);
  cv.addEventListener(&quot;pointercancel&quot;, drop);
})();

document.querySelectorAll(&quot;input[data-var]&quot;).forEach(function (el) {
  el.addEventListener(&quot;input&quot;, function () {
    var show = document.querySelector(&#x27;[data-show=&quot;&#x27; + el.dataset.var + &#x27;&quot;]&#x27;);
    if (show) show.textContent = el.value;
    setVar(el.dataset.var, el.value);
    runSoon();
  });
});
$(&quot;b-run&quot;).addEventListener(&quot;click&quot;, run);
$(&quot;b-run-all&quot;).addEventListener(&quot;click&quot;, runAll);
$(&quot;all&quot;).addEventListener(&quot;toggle&quot;, function () { if ($(&quot;all&quot;).open) runAll(); });
$(&quot;b-clear&quot;).addEventListener(&quot;click&quot;, function () { $(&quot;log&quot;).tBodies[0].innerHTML = &quot;&quot;; lastRow = &quot;&quot;; });
document.querySelectorAll(&quot;[data-copy]&quot;).forEach(function (b) {
  b.addEventListener(&quot;click&quot;, function () {
    var box = $(b.dataset.copy);
    try { navigator.clipboard.writeText(box.value); $(&quot;py-state&quot;).textContent = &quot;복사했다&quot;; }
    catch (e) { box.select(); }
  });
});
window.addEventListener(&quot;resize&quot;, paint);
if (window.matchMedia) window.matchMedia(&quot;(prefers-color-scheme: dark)&quot;).addEventListener(&quot;change&quot;, paint);

paint();
loadPyodide().then(function (p) {
  py = p;
  $(&quot;b-run&quot;).disabled = false;
  $(&quot;b-run-all&quot;).disabled = false;
  $(&quot;py-state&quot;).textContent = &quot;파이썬 준비됨&quot;;
  run();
}).catch(function () { $(&quot;py-state&quot;).textContent = &quot;파이썬을 불러오지 못했다. 인터넷 연결을 확인한다.&quot;; });
&lt;/script&gt;

<script>
  var tabs = [].slice.call(document.querySelectorAll("nav button")),
      frames = [].slice.call(document.querySelectorAll("iframe"));

  // 쪽 높이에 맞춰 iframe 을 늘린다
  function fit(f) {
    var d = f.contentDocument;
    if (!d || !d.body) return;
    var go = function () { f.style.height = d.documentElement.scrollHeight + "px"; };
    new ResizeObserver(go).observe(d.body);
    go();
  }
  function open(i) {
    tabs.forEach(function (b, j) { b.setAttribute("aria-selected", j === i ? "true" : "false"); });
    frames.forEach(function (f, j) {
      f.hidden = j !== i;
      if (j === i && !f.srcdoc) { f.addEventListener("load", function () { fit(f); }); f.srcdoc = f.dataset.src; }
    });
    try { history.replaceState(null, "", "#" + (i + 1)); } catch (e) {}
  }
  tabs.forEach(function (b, i) {
    b.addEventListener("click", function () { open(i); });
    b.addEventListener("keydown", function (e) {
      var d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      if (!d) return;
      var j = (i + d + tabs.length) % tabs.length;
      open(j); tabs[j].focus();
    });
  });
  var start = +location.hash.slice(1) - 1;
  open(start >= 0 && start < tabs.length ? start : 0);
</script>
